<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWALLOWS DATALAB</title>
  <link rel="icon" type="image/png" href="./logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- Supabase Official Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js Official Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- MediaPipe Tasks-Vision WASM Bundle & Pitching Biomechanics Engine -->
  <script type="module">
    import { FilesetResolver, PoseLandmarker } 
      from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

    // Import the 3 new pitching delivery modules
    import * as pitchBiometrics from "./js/pitchBiometrics.js";
    import * as pitchAnchorDetector from "./js/pitchAnchorDetector.js";
    import * as pitchOverlayRenderer from "./js/pitchOverlayRenderer.js";

    window.pitchBiometrics = pitchBiometrics;
    window.pitchAnchorDetector = pitchAnchorDetector;
    window.pitchOverlayRenderer = pitchOverlayRenderer;

    window.initMediaPipe = async function() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
      );
      return await PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numPoses: 1,
        minPoseDetectionConfidence: 0.6,
        minPosePresenceConfidence: 0.6,
        minTrackingConfidence: 0.6
      });
    };
  </script>
  <style>
    [v-cloak] { display: none !important; }
    /* Eliminates double-tap zoom & text selection on transport buttons */
    button, input, select, [role="button"], .touch-manipulation {
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #f59e0b;
      cursor: pointer;
    }

    /* SDL-UX-IA-04: screen-only shared visual tokens. No permission or routing rules. */
    @media screen {
      .sdl-shell { --sdl-surface: #151f30; --sdl-inset: #0c1423; --sdl-line: #334155; --sdl-muted: #a8b7cb; }
      .sdl-shell .sdl-panel { background: var(--sdl-surface); border: 1px solid var(--sdl-line); border-radius: 14px; box-shadow: none; }
      .sdl-shell .sdl-inset { background: var(--sdl-inset); border: 1px solid var(--sdl-line); border-radius: 12px; box-shadow: none; }
      .sdl-shell .sdl-muted { color: var(--sdl-muted); }
      .sdl-shell .sdl-tabs { background: var(--sdl-inset); border: 1px solid var(--sdl-line); border-radius: 12px; }
      .sdl-shell .sdl-tabs button[aria-pressed="true"] { background: #1d4ed8; color: #fff; }
      .sdl-shell .sdl-section-title { font-size: 1.125rem; font-weight: 700; line-height: 1.5; }
      .sdl-shell .sdl-primary { min-height: 44px; border-radius: 10px; background: #1d4ed8; color: #fff; }
      .sdl-shell .sdl-primary:not(:disabled):hover { background: #2563eb; }
      .sdl-shell .sdl-secondary { min-height: 44px; border-radius: 10px; border: 1px solid #475569; background: #1e293b; color: #e2e8f0; }
      .sdl-shell .sdl-secondary:not(:disabled):hover { background: #334155; }
      .sdl-shell .sdl-content :is(button,select,input,textarea,summary):focus-visible,
      .sdl-shell nav button:focus-visible { outline: 2px solid #67e8f9; outline-offset: 2px; }
      .sdl-shell .sdl-content :is(input,select,textarea) { max-width: 100%; }
      .sdl-shell .sdl-content [aria-label="Private player videos"] { overflow-wrap: anywhere; }
      .sdl-shell .sdl-content [aria-label="Private player videos"] h2 { font-size: 1.25rem; }
      .sdl-shell .sdl-content [aria-label="Private player videos"] h2,
      .sdl-shell .sdl-content [aria-label="Private player videos"] h3 { line-height: 1.5; }
      .sdl-shell .sdl-content [aria-label="Private player videos"] button { min-height: 44px; }
      @media (max-width: 767px) {
        .sdl-shell .sdl-content :is(input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),select,textarea) { font-size: 16px; }
      }
    }

    @media print {
      body {
        background: #ffffff !important;
        color: #0f172a !important;
        padding: 0 !important;
      }
      header, .no-print, nav, button, select, label {
        display: none !important;
      }
      .profile-print-section { display: block !important; }
      .print-card {
        background: #ffffff !important;
        border: 1px solid #cbd5e1 !important;
        box-shadow: none !important;
        color: #0f172a !important;
        page-break-inside: avoid;
      }
      table {
        color: #0f172a !important;
      }
      thead {
        background: #f1f5f9 !important;
        color: #334155 !important;
      }
      th, td {
        border-bottom: 1px solid #e2e8f0 !important;
      }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 sm:p-4 lg:p-6 font-sans">
  <div id="app" v-cloak class="max-w-7xl mx-auto">
    
    <!-- SDL-004-005: Authentication gate. No private app UI before verified session. -->
    <div v-if="!authReady" class="p-10 text-center text-slate-300" role="status">Checking secure session…</div>
    <login-landing v-else-if="!authUser" :controller="loginController"></login-landing>
    <template v-else>
      <app-shell :active-tab="activeTab" :mode="workspaceMode" :can-coach="isTeamCoach"
        :can-family="isVerifiedGuardian" :workspace-options="workspaceOptions" :account-email="authUser.email || ''" :sign-out-busy="authBusy"
        @navigate="navigateTab" @mode-change="changeWorkspace" @sign-out="signOutAndClear">

      <invite-onboarding v-if="pendingInvitation" :controller="pilotController" :account-email="authUser.email || ''"
        @dismiss="dismissInvitePrompt"></invite-onboarding>

      <section v-if="workspaceMode === 'coach' && ['home','team','stats'].includes(activeTab) && currentView === 'overview'" class="sdl-panel mb-4 grid gap-3 p-3 sm:grid-cols-2" aria-label="Coach roster scope">
        <label class="text-sm font-semibold">Club<select :value="coachOrganizationId" @change="changeCoachOrganization($event.target.value)" class="mt-2 block min-h-11 w-full rounded-lg border border-slate-600 bg-slate-950 px-3 py-2"><option value="">All authorized clubs</option><option v-for="org in coachOrganizations" :key="org.id" :value="org.id">{{ org.name }}</option></select></label>
        <label class="text-sm font-semibold">Team<select :value="coachTeamId" @change="changeCoachTeam($event.target.value)" class="mt-2 block w-full rounded-lg bg-slate-950 p-3"><option value="">All assigned teams</option><option v-for="team in coachTeams" :key="team.id" :value="team.id">{{ team.name }}</option></select></label>
      </section>

      <action-center class="mb-4" v-if="activeTab === 'home' && !authError" :items="actionCenterItems" :status="actionCenterStatus" @navigate="openActionCenter" @refresh="reviewQueue.retry"></action-center>
      <coach-home v-if="activeTab === 'home' && workspaceMode === 'coach'"
        :roster="coachRosterDisplay" :authorized-team-count="coachTeamCount" :loading="coachRosterLoading" :error="coachRosterError" @navigate="navigateTab" @open-profile="selectCoachRosterPlayer" @open-video="openAuthorizedPlayerVideos"></coach-home>
      <parent-home v-else-if="activeTab === 'home' && workspaceMode === 'family'"
        :players="familyPlayers" :loading="loading" @navigate="navigateTab" @open-profile="openFamilyPlayerProfile" @open-video="openAuthorizedPlayerVideos"></parent-home>
      <managed-roster v-else-if="activeTab === 'home' && isManagedWorkspace" :key="workspaceMode + ':' + managedRosterController.organizationId.value + ':' + managedRosterController.teamId.value" :controller="managedRosterController" :home="true"
        @organization="changeManagedOrganization" @team="changeManagedTeam" @retry="retryManagedRoster" @more="loadMoreManagedRoster" @open-profile="openManagedPlayerProfile" @navigate="navigateTab"></managed-roster>
      <section v-else-if="activeTab === 'home'" class="rounded-2xl border border-slate-700 bg-slate-800 p-6" aria-label="Account home">
        <h1 class="text-2xl font-black">Welcome to Swallows DataLab</h1>
        <p class="mt-2 text-sm text-slate-300">Your membership and permissions determine which team, family and administrative tools are available.</p>
        <button type="button" @click="navigateTab('me')" class="mt-4 rounded-xl bg-blue-600 px-4 py-3 text-sm font-bold">Open account workspace</button>
      </section>
      <h1 v-if="activeTab === 'stats' && currentView === 'overview'" class="mb-3 text-2xl font-black text-white sm:text-3xl">Stats</h1>
      <managed-roster v-if="activeTab === 'stats' && isManagedWorkspace" scope-only :controller="managedRosterController"
        @organization="changeManagedOrganization" @team="changeManagedTeam" @retry="retryManagedRoster" @more="loadMoreManagedRoster"></managed-roster>
      <performance-workspace v-if="activeTab === 'stats' && currentView === 'overview' && workspaceMode !== 'member'"
        organized :auth="loginController" :mode="workspaceMode" :players="performancePlayers" :teams="performanceReviewTeams"
        :fixed-player-id="isManagedWorkspace ? null : statsBoardController.selectedId.value" @updated="refreshPerformanceHistory">
        <template #player-context>
          <authorized-stats-board v-if="workspaceMode === 'coach' || workspaceMode === 'family'"
            context-only :controller="statsBoardController" @open-profile="selectPlayer"></authorized-stats-board>
        </template>
        <template #overview>
          <authorized-stats-board v-if="workspaceMode === 'coach' || workspaceMode === 'family'"
            results-only :controller="statsBoardController" @open-profile="selectPlayer"></authorized-stats-board>
        </template>
      </performance-workspace>
      <!-- Retain the existing permissioned family summary as supplementary content,
           without making the disabled pilot projection the primary Stats experience. -->
      <details v-if="activeTab === 'stats' && currentView === 'overview' && workspaceMode === 'family' && (submissionController.enabled || statsFamilyCards.length)"
        class="mb-4 rounded-xl border border-slate-700 p-3">
        <summary class="min-h-11 cursor-pointer py-3 text-sm font-semibold">Family statistics summary</summary>
        <stats-hub :mode="workspaceMode" :coach-roster="coachRosterDisplay" :family-cards="statsFamilyCards"
          :loading="loading" :enabled="submissionController.enabled" :show-synthetic="false"
          @navigate="navigateTab" @open-player="submissionController.showProfile($event)"></stats-hub>
      </details>
      <stats-hub v-if="activeTab === 'stats' && currentView === 'overview' && workspaceMode === 'member'"
        :mode="workspaceMode" :coach-roster="coachRosterDisplay" :family-cards="statsFamilyCards"
        :loading="loading" :enabled="submissionController.enabled" :show-synthetic="false"
        @navigate="navigateTab" @open-player="submissionController.showProfile($event)"></stats-hub>
      <managed-roster v-if="activeTab === 'team' && currentView === 'overview' && isManagedWorkspace" :key="workspaceMode + ':' + managedRosterController.organizationId.value + ':' + managedRosterController.teamId.value" :controller="managedRosterController"
        @organization="changeManagedOrganization" @team="changeManagedTeam" @retry="retryManagedRoster" @more="loadMoreManagedRoster" @open-profile="openManagedPlayerProfile" @navigate="navigateTab"></managed-roster>

      <staging-data-browser v-if="activeTab === 'team' && currentView === 'overview' && workspaceMode === 'family'"
        :players="visibleStagingPlayers" :mode="workspaceMode" :loading="loading || (workspaceMode === 'coach' && coachRosterLoading)"
        :error="workspaceMode === 'coach' ? coachRosterError : ''" :video-here="mediaOriginAllowed"
        @navigate="navigateTab" @open-video="openAuthorizedPlayerVideos"></staging-data-browser>

      <section v-if="activeTab === 'videos' && !mediaOriginAllowed" aria-label="Staging video viewer" class="mb-6 rounded-2xl border border-amber-500/40 bg-slate-900 p-5 sm:p-6">
        <p class="text-xs font-bold uppercase tracking-widest text-amber-300">Private staging video</p>
        <h2 class="mt-2 text-xl font-black text-white">Open the authorized video viewer</h2>
        <p class="mt-2 text-sm text-slate-300">This hostname is not an approved private-media origin. Use the authorized staging portal instead. Staging video access always requires your valid account and per-player permission.</p>
        <a href="https://sdl-staging.pages.dev/" target="_blank" rel="noopener noreferrer"
          class="mt-4 inline-flex rounded-xl bg-blue-600 px-5 py-3 text-sm font-bold text-white hover:bg-blue-500">Open secure staging video portal</a>
        <p class="mt-3 text-xs text-slate-400">Sign in there with your same staging account and select Private player videos. No data or media is copied between the two sites.</p>
      </section>

      <section :class="activeTab === 'me' ? '' : 'hidden'" class="mb-4 space-y-4 no-print" aria-label="Account and settings">
        <header><h1 class="text-2xl font-bold tracking-tight text-white sm:text-3xl">Me</h1><p class="mt-1 text-sm sdl-muted">Your account, access and preferences.</p></header>
        <div class="sdl-panel space-y-4 p-4 sm:p-5">
          <div class="flex min-w-0 items-center gap-3">
            <span aria-hidden="true" class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-blue-950 text-xl font-bold text-cyan-200">{{ (authUser.email || '?').charAt(0).toUpperCase() }}</span>
            <div class="min-w-0 flex-1">
              <p class="text-xs sdl-muted">Signed in as</p>
              <p class="break-all font-semibold text-white">{{ authUser.email || 'Signed-in account' }}</p>
              <p class="mt-1 text-sm sdl-muted">{{ workspaceOptions.find(option=>option.id===workspaceMode)?.label || 'Limited access' }} workspace</p>
            </div>
          </div>
          <div class="space-y-2 border-t border-slate-700 pt-3">
            <h2 class="sdl-section-title">Workspace access</h2>
            <div v-if="workspaceOptions.length" class="flex flex-wrap gap-2">
              <span v-for="option in workspaceOptions" :key="option.id" class="rounded-lg border border-slate-600 bg-slate-950 px-3 py-1.5 text-sm" :class="option.id===workspaceMode ? 'text-cyan-200' : 'text-slate-300'">{{ option.label }}{{ option.id===workspaceMode ? ' · Active' : '' }}</span>
            </div>
            <p v-else class="text-sm sdl-muted">No enabled workspace</p>
            <dl class="grid grid-cols-3 gap-2 pt-2">
              <div class="min-w-0"><dt class="text-xs sdl-muted">Authorized clubs</dt><dd class="mt-1 text-xl font-semibold tabular-nums">{{ ordinaryOrganizations.length }}</dd></div>
              <div class="min-w-0"><dt class="text-xs sdl-muted">Authorized teams</dt><dd class="mt-1 text-xl font-semibold tabular-nums">{{ ordinaryTeams.length }}</dd></div>
              <div class="min-w-0"><dt class="text-xs sdl-muted">Verified guardian links</dt><dd class="mt-1 text-xl font-semibold tabular-nums">{{ guardianLinks.length }}</dd></div>
            </dl>
            <p class="text-xs sdl-muted">Access is determined by your verified membership and guardian links.</p>
          </div>
        </div>
        <!-- Synthetic staging consent acceptance surface; UX-003 owns final presentation. -->
        <media-consent-panel v-if="activeTab === 'me' && workspaceMode === 'family' && isVerifiedGuardian && mediaOriginAllowed"
          :key="authUser.id" :auth="loginController" :players="familyPlayers"></media-consent-panel>
        <section class="sdl-panel space-y-3 p-4 sm:p-5" aria-label="Preferences">
          <h2 class="sdl-section-title">Preferences</h2>
          <label class="block max-w-sm text-sm font-semibold text-slate-200">Language
            <select :value="currentLang" @change="currentLang = $event.target.value; saveLanguage()" class="mt-2 block min-h-11 w-full rounded-lg border border-slate-600 bg-slate-950 px-3 py-2 text-base">
              <option value="en">English (EN)</option><option value="zh">繁體中文 (ZH)</option><option value="ja">日本語 (JA)</option>
            </select>
          </label>
        </section>
        <section class="sdl-panel flex flex-wrap items-center justify-between gap-3 p-4 sm:p-5" aria-label="Account session">
          <div><h2 class="sdl-section-title">Account session</h2><p class="text-sm sdl-muted">Sign out when you finish using this device.</p></div>
          <button type="button" @click="signOutAndClear" :disabled="authBusy" class="sdl-secondary px-4 py-2 text-sm font-semibold disabled:opacity-50">Sign out</button>
        </section>
      </section>
      <div v-if="authError" role="alert" class="mb-3 text-rose-300 text-sm no-print">{{ authError }} <button type="button" class="ml-2 underline" @click="reloadMemberships">Refresh account permissions</button></div>
    <!-- Top Header Bar (Hidden during printing) -->
    <app-header class="hidden" :t="t" :current-lang="currentLang" :current-view="currentView" :is-coach="isCoach"
      @change-language="currentLang = $event; saveLanguage()"
      @navigate-overview="currentView = 'overview'; if (isVerifiedGuardian && !isTeamCoach) submissionController.changeTab('players')"
      @export-csv="exportTeamCSV" @import-csv="importTeamCSV($event)"
      @add-player="openAddPlayerModal" @lock-coach="lockCoachMode"
      @unlock-coach="unlockCoachMode"></app-header>

    <!-- Presentation grouping only. Preserve the original mounted controllers and role scope. -->
     <details :class="activeTab === 'me' && !isManagedWorkspace ? 'sdl-panel mb-4 p-4 no-print' : 'hidden'" :open="pilotController.enabled ? true : undefined" aria-label="Additional family and staff tools">
       <summary class="min-h-11 cursor-pointer py-2 font-semibold">Family and staff tools{{ pilotController.enabled ? '' : ' · currently unavailable' }}</summary>
       <p class="mb-2 text-sm sdl-muted">Invitations, private family information and scoped staff workflows, where available to your account.</p>
       <pilot-workspace :controller="pilotController"></pilot-workspace>
     </details>
     <details :class="activeTab === 'me' && !isManagedWorkspace && enrollmentAdminController.visible.value ? 'sdl-panel mb-4 p-4 no-print' : 'hidden'" :open="enrollmentAdminController.enabled ? true : undefined" aria-label="Enrollment tools">
       <summary class="min-h-11 cursor-pointer py-2 font-semibold">Club enrollment tools{{ enrollmentAdminController.enabled ? '' : ' · currently unavailable' }}</summary>
       <club-enrollment-admin :controller="enrollmentAdminController"></club-enrollment-admin>
     </details>
    <!-- Private staging avatars: all available profiles are server-filtered. -->
    <avatar-manager :controller="avatarController" :show-list="activeTab === 'me' && workspaceMode === 'admin'" @open-profile="openManagedPlayerProfile"></avatar-manager>

    <!-- Loading Indicator -->
    <div v-if="loading" class="p-8 text-center text-slate-400 font-mono text-sm no-print">
      {{ t('syncingData') }}
    </div>

    <!-- SDL-001 / SDL-004: Verified parents land on My Players above, not the legacy Coach Overview -->
    <coach-team-roster v-else-if="currentView === 'overview' && isTeamCoach && workspaceMode === 'coach'" :key="coachOrganizationId + ':' + coachTeamId" :class="activeTab === 'team' ? '' : 'hidden'"
      :roster="coachRosterDisplay" :show-team-filter="false" :show-review="submissionController.enabled" :loading="coachRosterLoading" :error="coachRosterError" @open-review="submissionController.enterReview($event)" @open-profile="selectCoachRosterPlayer"></coach-team-roster>
    <team-overview v-else-if="currentView === 'overview' && isCoach && workspaceMode === 'coach'" :class="activeTab === 'team' || activeTab === 'stats' ? '' : 'hidden'"
      :t="t"
      :players="players"
      :get-club-count="getClubCount"
      :avg-bat-speed="avgBatSpeed"
      :safety-alert-count="safetyAlertCount"
      :overview-tab="overviewTab"
      :search-query="searchQuery"
      @update:overview-tab="overviewTab = $event"
      @update:search-query="searchQuery = $event"
      :filtered-players="filteredPlayers"
      :failed-imgs="failedImgs"
      :format-img-url="formatImgUrl"
      :get-player-display-name="getPlayerDisplayName"
      :mark-img-failed="markImgFailed"
      :select-player="selectPlayer"
      :calculate-age="calculateAge"
      :split-positions="splitPositions"
      :get-latest-metric="getLatestMetric"
      :get-attack-angle-color="getAttackAngleColor"
      :calculate-jump-ratio="calculateJumpRatio"
      :get-jump-ratio-color="getJumpRatioColor"
      :is-coach="isCoach"
      :open-log-modal="openLogModal"
      :open-edit-player-modal="openEditPlayerModal"
      :remove-player="removePlayer"
      :get-top-metrics="getTopMetrics"
      :get-top-jump-ratios="getTopJumpRatios"
    ></team-overview>


    <!-- VIEW 2: Individual Player Profile & Dated Session History -->
    <player-profile v-if="currentView === 'player' && selectedPlayer" :key="workspaceMode + ':' + selectedPlayer.id" :class="activeTab === 'team' ? '' : 'hidden'" :can-edit-photo="canEditPlayerPhoto(selectedPlayer.id)" @edit-photo="avatarManager.choose($event)"
      :t="t" :selected-player="selectedPlayer" :is-coach="isCoach" :history-loading="profileHistoryLoading" :history-error="profileHistoryError"
      :failed-imgs="failedImgs" :format-img-url="formatImgUrl" :mark-img-failed="markImgFailed"
      :format-legal-name="formatLegalName" :get-player-display-name="getPlayerDisplayName"
      :get-latest-metric="getLatestMetric" :split-positions="splitPositions" :calculate-age="calculateAge"
      :calculate-jump-ratio="calculateJumpRatio" :get-jump-ratio-color="getJumpRatioColor"
      :format-height-weight="formatHeightWeight" :get-player-sessions="getPlayerSessions"
      :get-session-jump-ratio="getSessionJumpRatio"
      :chart-mode="chartMode" :has-chart-data="hasChartData" :set-chart-mode="setChartMode"
      :player-drill-videos="playerDrillVideos" :open-analyzer="openAnalyzer"
      :open-upload-video-modal="openUploadVideoModal" :open-edit-player-modal="openEditPlayerModal"
      :open-log-modal="openLogModal" :trigger-print-report="triggerPrintReport"
      :is-session-expanded="isSessionExpanded" :toggle-session-expand="toggleSessionExpand"
      :get-attack-angle-color="getAttackAngleColor" :open-edit-session-modal="openEditSessionModal"
      :remove-session="removeSession" :delete-drill-video="deleteDrillVideo"
      @open-submissions="submissionController.changeTab('submissions'); submissionController.selectPlayer($event)" @back="leavePlayerProfile">
      <template #performance>
        <performance-workspace v-if="activeTab === 'team' && performancePlayers.some(row => row.id === selectedPlayer.id)"
          :auth="loginController" :mode="workspaceMode" :players="performancePlayers"
          :fixed-player-id="selectedPlayer.id" @updated="refreshPerformanceHistory"></performance-workspace>
      </template>
      <template #private-media>
        <private-media-panel v-if="activeTab === 'team' && mediaOriginAllowed && privateMediaController.mediaPlayers.value.some(row => row.id === selectedPlayer.id)"
          :controller="privateMediaController" :profile-player-id="selectedPlayer.id"></private-media-panel>
        <p v-else class="rounded-xl border border-slate-700 bg-slate-900 p-4 text-sm text-slate-300">
          Private videos require an authorized player and staging session.
        </p>
      </template>
    </player-profile>

    <!-- UX-003: Library and Clubhouse are distinct destinations; existing authorization stays in their controllers. -->
    <section v-if="activeTab === 'videos' && mediaOriginAllowed && !authError" class="mb-4 space-y-2 no-print" aria-label="Videos navigation">
      <h1 class="text-2xl font-black text-white">Videos</h1>
      <nav class="sdl-tabs flex flex-wrap gap-2 p-1.5" :aria-label="t('videoSections')">
        <button v-for="destination in videos.primaryDestinations.value" :key="destination" type="button"
          @click="changeVideoSection(destination)" :aria-pressed="videoSection===destination"
          :disabled="videoSectionBusy && videoSection!==destination"
          :class="videoSection===destination?'bg-cyan-900 text-cyan-100':'text-slate-300'"
          class="min-h-11 rounded-lg px-4 py-2 text-sm font-bold disabled:opacity-50">{{t({mine:'videoMine',shared:'videoTeam',staff:'videoStaff',review:'videoReview'}[destination])}}</button>
      </nav>
      <button v-if="videos.secondaryShared.value && (videoSection==='mine' || videoSection==='shared')"
        type="button" :aria-pressed="videoSection==='shared'" :disabled="videoSectionBusy"
        class="sdl-secondary min-h-11 px-4 py-2" @click="changeVideoSection('shared')">{{t('videoTeam')}}</button>
      <template v-if="videoSection==='staff'">
        <label v-if="videos.staffScopes.value.length>1" class="block max-w-lg text-sm">{{t('videoStaffScope')}}
          <select class="block min-h-11 w-full rounded-lg bg-slate-950 p-2 text-base" :disabled="videoSectionBusy"
            :value="videos.staffScope.value?.key || ''" @change="changeVideoStaff($event.target.value)">
            <option value="" disabled>{{t('videoChooseScope')}}</option>
            <option v-for="scope in videos.staffScopes.value" :key="scope.key" :value="scope.key">{{scope.club}} · {{scope.teamName || t('videoClubRoster')}} · {{t({coach:'videoRoleCoach',manager:'videoRoleManager',club_admin:'videoRoleAdmin'}[scope.role])}}</option>
          </select>
        </label>
        <div v-if="videos.staffTeams.value.length" class="flex flex-wrap gap-2">
          <button type="button" @click="changeVideoTeamView('library')" :aria-pressed="videos.teamView.value==='library'" :disabled="videoSectionBusy" class="sdl-secondary min-h-11 px-4">{{t('videoPrivateLibrary')}}</button>
          <button type="button" @click="changeVideoTeamView('shared')" :aria-pressed="videos.teamView.value==='shared'" :disabled="videoSectionBusy" class="sdl-secondary min-h-11 px-4">{{t('videoShared')}}</button>
        </div>
      </template>
      <label v-if="videoSection==='review' && videos.scopes.value.length>1" class="block max-w-lg text-sm">{{t('videoReviewScope')}}
        <select class="block min-h-11 w-full rounded-lg bg-slate-950 p-2 text-base" :disabled="videoSectionBusy"
          :value="videos.reviewMode.value" @change="changeVideoReview($event.target.value)">
          <option v-for="entry in videos.scopes.value" :key="entry.mode" :value="entry.mode">{{t(entry.mode==='coach'?'videoRoleCoach':'videoRoleAdmin')}}</option>
        </select>
      </label>
      <button v-if="videoSection==='review' && videos.homeScoped.value" type="button" :disabled="videoSectionBusy"
        @click="changeVideoReview(videos.reviewMode.value)" class="sdl-secondary min-h-11 px-4">{{t('videoAllReviewTeams')}}</button>
      <p v-if="videoSectionBusy" role="status" class="text-xs text-slate-400">Finish the current media action before switching sections.</p>
      <p v-if="videos.busy.value && isVideoLibrary" role="status" class="text-sm text-slate-300">{{t('videoLoadingPlayers')}}</p>
      <div v-if="videos.error.value && isVideoLibrary" role="alert" class="text-sm text-rose-300">
        {{t('videoRosterUnavailable')}} <button type="button" class="min-h-11 underline" @click="videos.load()">{{t('videoRetry')}}</button>
      </div>
      <button v-if="videos.next.value && isVideoLibrary" type="button" :disabled="videos.busy.value||videoSectionBusy" @click="videos.load(true)" class="sdl-secondary min-h-11 px-4">{{t('videoMorePlayers')}}</button>
    </section>
    <private-media-panel v-if="activeTab === 'videos' && mediaOriginAllowed && isVideoLibrary && (videoSection==='mine'||videos.staffScope.value)"
      :restrict-moderation="!videoModeration" :controller="privateMediaController"></private-media-panel>
    <template v-if="activeTab === 'videos' && mediaOriginAllowed && !authError && videoSection==='review' && reviewScope">
      <video-review-inbox :available="reviewQueue.available.value" :scope="reviewScope" :status="reviewQueue.status.value" :rows="reviewQueue.rows.value" :filters="reviewQueue.filters.value" :teams="reviewQueue.teams.value" :players="reviewQueue.players.value" :total="reviewQueue.total.value" :filtered-total="reviewQueue.filteredTotal.value" :has-more="!!reviewQueue.next.value" :busy="reviewQueue.opening.value || privateMediaController.mediaReviewing.value" @filter="reviewQueue.filter" @refresh="reviewQueue.retry" @more="reviewQueue.refreshInbox(true)" @open="reviewQueue.open"></video-review-inbox>
      <p v-if="reviewQueue.notice.value" role="status" class="my-3 text-sm text-amber-200">{{reviewQueue.notice.value}}</p>
      <private-media-panel review-only :controller="privateMediaController" @close-review="closeInboxReview"></private-media-panel>
    </template>
    <media-publication-panel v-if="activeTab === 'videos' && mediaOriginAllowed && !authError && isVideoLibrary && videoModeration && privateMediaController.mediaPlayerId.value"
      ref="publicationPanel" :key="clubhouseScopeKey + ':' + privateMediaController.mediaPlayerId.value" :auth="loginController" :controller="privateMediaController"></media-publication-panel>
    <clubhouse-media-panel v-if="activeTab === 'videos' && mediaOriginAllowed && !authError && clubhouseMediaTeams.length"
      :key="clubhouseScopeKey" :auth="loginController" :teams="clubhouseMediaTeams"></clubhouse-media-panel>

    <!-- Keep the existing gated workspace mounted and reachable, after the primary roster/library.
         The details disclosure changes presentation only; it does not enable any operation. -->
    <details :open="submissionController.enabled ? true : undefined"
      :class="!isManagedWorkspace && (activeTab === 'team' || activeTab === 'stats' || (activeTab === 'videos' && mediaOriginAllowed && isVideoLibrary)) && currentView !== 'player' ? 'mt-4 rounded-xl border border-slate-700 p-3 no-print' : 'hidden'">
      <summary class="min-h-11 cursor-pointer py-3 text-sm font-semibold text-slate-300">{{ submissionController.enabled ? 'Submissions and Clubhouse' : 'Submissions and Clubhouse · currently unavailable' }}</summary>
      <submission-workspace :show-performance-review="activeTab !== 'stats'" :controller="submissionController" :pilot-controller="pilotController" :t="t"></submission-workspace>
    </details>

    <!-- SDL-002: Unified Player Form (Add / Edit) -->
    <player-form-modal
      v-if="isCoach && (showAddPlayerModal || (showEditPlayerModal && editingPlayer))"
      :mode="showAddPlayerModal ? 'add' : 'edit'"
      :player="showAddPlayerModal ? newPlayer : editingPlayer"
      :positions="showAddPlayerModal ? selectedAddPositions : selectedEditPositions"
      :is-saving="isSaving"
      :is-uploading-photo="isUploadingPhoto"
      :is-coach="isCoach"
      :t="t"
      :format-img-url="formatImgUrl"
      @close="showAddPlayerModal = false; showEditPlayerModal = false"
      @submit="showAddPlayerModal ? addPlayer() : updatePlayer()"
      @name-part-input="showAddPlayerModal && onNamePartInput()"
      @preferred-name-input="isPreferredCustomized = true"
      @toggle-position="showAddPlayerModal ? toggleAddPosition($event) : toggleEditPosition($event)"
      @file-upload="handleFileUpload($event)"
    ></player-form-modal>

    <!-- MODAL: Upload Drill Video (Stage 1) -->
    <upload-video-modal v-if="showUploadVideoModal && isCoach && activePlayerForVideo"
      :t="t" :active-player-for-video="activePlayerForVideo" :get-player-display-name="getPlayerDisplayName"
      :new-drill-video="newDrillVideo" :is-uploading-video="isUploadingVideo" :selected-video-file="selectedVideoFile"
      @pick-file="handleVideoFilePick($event)" @submit="uploadDrillVideo"
      @close="showUploadVideoModal = false"></upload-video-modal>

    <!-- MODAL: Log Station Data -->
    <session-form-modal v-if="isCoach && (showLogModal && activePlayerForLog || showEditSessionModal && editingSession)"
      :t="t" :mode="showLogModal ? 'add' : 'edit'"
      :session="showLogModal ? newSession : editingSession"
      :active-player-for-log="activePlayerForLog || selectedPlayer || { preferred_name: '' }"
      :get-player-display-name="getPlayerDisplayName"
      :speed-unit="showLogModal ? logSpeedUnit : editSpeedUnit"
      @speed-unit="toggleSpeedUnit(showLogModal ? 'log' : 'edit', $event)"
      @close="showLogModal = false; showEditSessionModal = false"
      @submit="showLogModal ? saveSession() : updateSession()"></session-form-modal>
    <!-- ================================================================= -->
    <!-- STAGE 2: DUGOUT AR VIDEO ANALYZER MODAL                           -->
    <!-- ================================================================= -->
    <ar-analyzer-modal v-if="activeAnalyzerVideo" :t="t"
      :controller="analyzerController"></ar-analyzer-modal>

      </app-shell>
    </template>
  </div>

  <!-- Root Application Entry Module -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
