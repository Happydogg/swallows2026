<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SWALLOWS DATALAB</title>
  <link rel="icon" type="image/png" href="./logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- Supabase Official Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js Official Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- MediaPipe Tasks-Vision WASM Bundle & Pitching Biomechanics Engine -->
  <script type="module">
    import { FilesetResolver, PoseLandmarker } 
      from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

    // Import the 3 new pitching delivery modules
    import * as pitchBiometrics from "./js/pitchBiometrics.js";
    import * as pitchAnchorDetector from "./js/pitchAnchorDetector.js";
    import * as pitchOverlayRenderer from "./js/pitchOverlayRenderer.js";

    window.pitchBiometrics = pitchBiometrics;
    window.pitchAnchorDetector = pitchAnchorDetector;
    window.pitchOverlayRenderer = pitchOverlayRenderer;

    window.initMediaPipe = async function() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
      );
      return await PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numPoses: 1,
        minPoseDetectionConfidence: 0.6,
        minPosePresenceConfidence: 0.6,
        minTrackingConfidence: 0.6
      });
    };
  </script>
  <style>
    [v-cloak] { display: none !important; }
    /* Eliminates double-tap zoom & text selection on transport buttons */
    button, input, select, [role="button"], .touch-manipulation {
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #f59e0b;
      cursor: pointer;
    }

    @media print {
      body {
        background: #ffffff !important;
        color: #0f172a !important;
        padding: 0 !important;
      }
      header, .no-print, nav, button, select, label {
        display: none !important;
      }
      .print-card {
        background: #ffffff !important;
        border: 1px solid #cbd5e1 !important;
        box-shadow: none !important;
        color: #0f172a !important;
        page-break-inside: avoid;
      }
      table {
        color: #0f172a !important;
      }
      thead {
        background: #f1f5f9 !important;
        color: #334155 !important;
      }
      th, td {
        border-bottom: 1px solid #e2e8f0 !important;
      }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div id="app" v-cloak class="max-w-6xl mx-auto">
    
    <!-- SDL-004-005: Authentication gate. No private app UI before verified session. -->
    <div v-if="!authReady" class="p-10 text-center text-slate-300" role="status">Checking secure session…</div>
    <login-landing v-else-if="!authUser" :controller="loginController"></login-landing>
    <template v-else>
      <app-shell :active-tab="activeTab" :mode="workspaceMode" :can-coach="isTeamCoach"
        :can-family="isVerifiedGuardian" :account-email="authUser.email || ''" :sign-out-busy="authBusy"
        @navigate="navigateTab" @mode-change="changeWorkspace" @sign-out="signOutAndClear">

      <invite-onboarding v-if="pendingInvitation" :controller="pilotController" :account-email="authUser.email || ''"
        @dismiss="dismissInvitePrompt"></invite-onboarding>

      <coach-home v-if="activeTab === 'home' && workspaceMode === 'coach'"
        :roster="coachRoster" :loading="coachRosterLoading" :error="coachRosterError" @navigate="navigateTab"></coach-home>
      <parent-home v-else-if="activeTab === 'home' && workspaceMode === 'family'"
        :players="familyPlayers" :loading="loading" @navigate="navigateTab"></parent-home>
      <section v-else-if="activeTab === 'home'" class="rounded-2xl border border-slate-700 bg-slate-800 p-6" aria-label="Account home">
        <h1 class="text-2xl font-black">Welcome to Swallows DataLab</h1>
        <p class="mt-2 text-sm text-slate-300">Your membership and permissions determine which team, family and administrative tools are available.</p>
        <button type="button" @click="navigateTab('me')" class="mt-4 rounded-xl bg-blue-600 px-4 py-3 text-sm font-bold">Open account workspace</button>
      </section>
      <stats-hub v-if="activeTab === 'stats' && currentView === 'overview'"
        :mode="workspaceMode" :coach-roster="coachRoster" :family-cards="statsFamilyCards"
        :loading="loading" :enabled="submissionController.enabled"
        @navigate="navigateTab" @open-player="submissionController.showProfile($event)"></stats-hub>

      <staging-data-browser v-if="activeTab === 'team' && currentView === 'overview' && (workspaceMode === 'coach' || workspaceMode === 'family')"
        :players="visibleStagingPlayers" :mode="workspaceMode" :loading="loading || (workspaceMode === 'coach' && coachRosterLoading)"
        :error="workspaceMode === 'coach' ? coachRosterError : ''" :video-here="mediaOriginAllowed"
        @navigate="navigateTab"></staging-data-browser>

      <section v-if="activeTab === 'videos' && !mediaOriginAllowed" aria-label="Staging video viewer" class="mb-6 rounded-2xl border border-amber-500/40 bg-slate-900 p-5 sm:p-6">
        <p class="text-xs font-bold uppercase tracking-widest text-amber-300">Private staging video</p>
        <h2 class="mt-2 text-xl font-black text-white">Open the authorized video viewer</h2>
        <p class="mt-2 text-sm text-slate-300">This hostname is not an approved private-media origin. Use the authorized staging portal instead. Staging video access always requires your valid account and per-player permission.</p>
        <a href="https://sdl-staging.pages.dev/" target="_blank" rel="noopener noreferrer"
          class="mt-4 inline-flex rounded-xl bg-blue-600 px-5 py-3 text-sm font-bold text-white hover:bg-blue-500">Open secure staging video portal</a>
        <p class="mt-3 text-xs text-slate-400">Sign in there with your same staging account and select Private player videos. No data or media is copied between the two sites.</p>
      </section>

      <section :class="activeTab === 'me' ? '' : 'hidden'" class="mb-4 flex flex-wrap items-center justify-between gap-3 bg-slate-800 border border-slate-700 p-3 rounded-lg no-print">
        <div class="text-sm">
          <div class="font-semibold">{{ authUser.email }}</div>
          <div class="text-slate-400">{{ isTeamCoach ? 'Team coach (read-only pilot)' : isVerifiedGuardian ? 'My Players (guardian)' : 'No team or family access' }}</div>
          <div class="text-xs text-slate-500">Organizations: {{ orgMemberships.length }} · Teams: {{ teamMemberships.length }} · Guardian links: {{ guardianLinks.length }}</div>
        </div>
        <button @click="signOutAndClear" :disabled="authBusy" class="bg-slate-700 px-4 py-2 rounded text-sm">Sign out</button>
      </section>
      <p v-if="authError" role="alert" class="mb-3 text-rose-300 text-sm no-print">{{ authError }}</p>
    <!-- Top Header Bar (Hidden during printing) -->
    <app-header :class="activeTab === 'team' || activeTab === 'stats' ? '' : 'hidden'" :t="t" :current-lang="currentLang" :current-view="currentView" :is-coach="isCoach"
      @change-language="currentLang = $event; saveLanguage()"
      @navigate-overview="currentView = 'overview'; if (isVerifiedGuardian && !isTeamCoach) submissionController.changeTab('players')"
      @export-csv="exportTeamCSV" @import-csv="importTeamCSV($event)"
      @add-player="openAddPlayerModal" @lock-coach="lockCoachMode"
      @unlock-coach="unlockCoachMode"></app-header>

    <pilot-workspace :class="activeTab === 'me' ? '' : 'hidden'" :controller="pilotController"></pilot-workspace>
    <submission-workspace :class="(activeTab === 'team' || activeTab === 'stats' || (activeTab === 'videos' && mediaOriginAllowed)) && currentView !== 'player' ? '' : 'hidden'" :controller="submissionController" :pilot-controller="pilotController" :t="t"></submission-workspace>
    <club-enrollment-admin :class="activeTab === 'me' ? '' : 'hidden'" :controller="enrollmentAdminController"></club-enrollment-admin>
    <private-media-panel :class="activeTab === 'videos' && mediaOriginAllowed ? '' : 'hidden'" :controller="privateMediaController"></private-media-panel>

    <!-- Loading Indicator -->
    <div v-if="loading" class="p-8 text-center text-slate-400 font-mono text-sm no-print">
      {{ t('syncingData') }}
    </div>

    <!-- SDL-001 / SDL-004: Verified parents land on My Players above, not the legacy Coach Overview -->
    <coach-team-roster v-else-if="currentView === 'overview' && isTeamCoach && workspaceMode === 'coach'" :class="activeTab === 'team' ? '' : 'hidden'"
      :roster="coachRoster" :loading="coachRosterLoading" :error="coachRosterError" @open-review="submissionController.enterReview($event)"></coach-team-roster>
    <team-overview v-else-if="currentView === 'overview' && isCoach && workspaceMode === 'coach'" :class="activeTab === 'team' || activeTab === 'stats' ? '' : 'hidden'"
      :t="t"
      :players="players"
      :get-club-count="getClubCount"
      :avg-bat-speed="avgBatSpeed"
      :safety-alert-count="safetyAlertCount"
      :overview-tab="overviewTab"
      :search-query="searchQuery"
      @update:overview-tab="overviewTab = $event"
      @update:search-query="searchQuery = $event"
      :filtered-players="filteredPlayers"
      :failed-imgs="failedImgs"
      :format-img-url="formatImgUrl"
      :get-player-display-name="getPlayerDisplayName"
      :mark-img-failed="markImgFailed"
      :select-player="selectPlayer"
      :calculate-age="calculateAge"
      :split-positions="splitPositions"
      :get-latest-metric="getLatestMetric"
      :get-attack-angle-color="getAttackAngleColor"
      :calculate-jump-ratio="calculateJumpRatio"
      :get-jump-ratio-color="getJumpRatioColor"
      :is-coach="isCoach"
      :open-log-modal="openLogModal"
      :open-edit-player-modal="openEditPlayerModal"
      :remove-player="removePlayer"
      :get-top-metrics="getTopMetrics"
      :get-top-jump-ratios="getTopJumpRatios"
    ></team-overview>


    <!-- VIEW 2: Individual Player Profile & Dated Session History -->
    <player-profile v-if="currentView === 'player' && selectedPlayer" :class="activeTab === 'team' ? '' : 'hidden'"
      :t="t" :selected-player="selectedPlayer" :is-coach="isCoach"
      :failed-imgs="failedImgs" :format-img-url="formatImgUrl" :mark-img-failed="markImgFailed"
      :format-legal-name="formatLegalName" :get-player-display-name="getPlayerDisplayName"
      :get-latest-metric="getLatestMetric" :split-positions="splitPositions" :calculate-age="calculateAge"
      :calculate-jump-ratio="calculateJumpRatio" :get-jump-ratio-color="getJumpRatioColor"
      :format-height-weight="formatHeightWeight" :get-player-sessions="getPlayerSessions"
      :get-session-jump-ratio="getSessionJumpRatio"
      :chart-mode="chartMode" :has-chart-data="hasChartData" :set-chart-mode="setChartMode"
      :player-drill-videos="playerDrillVideos" :open-analyzer="openAnalyzer"
      :open-upload-video-modal="openUploadVideoModal" :open-edit-player-modal="openEditPlayerModal"
      :open-log-modal="openLogModal" :trigger-print-report="triggerPrintReport"
      :is-session-expanded="isSessionExpanded" :toggle-session-expand="toggleSessionExpand"
      :get-attack-angle-color="getAttackAngleColor" :open-edit-session-modal="openEditSessionModal"
      :remove-session="removeSession" :delete-drill-video="deleteDrillVideo"
      @open-submissions="submissionController.changeTab('submissions'); submissionController.selectPlayer($event)" @back="currentView = 'overview'"></player-profile>

    <!-- SDL-002: Unified Player Form (Add / Edit) -->
    <player-form-modal
      v-if="isCoach && (showAddPlayerModal || (showEditPlayerModal && editingPlayer))"
      :mode="showAddPlayerModal ? 'add' : 'edit'"
      :player="showAddPlayerModal ? newPlayer : editingPlayer"
      :positions="showAddPlayerModal ? selectedAddPositions : selectedEditPositions"
      :is-saving="isSaving"
      :is-uploading-photo="isUploadingPhoto"
      :is-coach="isCoach"
      :t="t"
      :format-img-url="formatImgUrl"
      @close="showAddPlayerModal = false; showEditPlayerModal = false"
      @submit="showAddPlayerModal ? addPlayer() : updatePlayer()"
      @name-part-input="showAddPlayerModal && onNamePartInput()"
      @preferred-name-input="isPreferredCustomized = true"
      @toggle-position="showAddPlayerModal ? toggleAddPosition($event) : toggleEditPosition($event)"
      @file-upload="handleFileUpload($event)"
    ></player-form-modal>

    <!-- MODAL: Upload Drill Video (Stage 1) -->
    <upload-video-modal v-if="showUploadVideoModal && isCoach && activePlayerForVideo"
      :t="t" :active-player-for-video="activePlayerForVideo" :get-player-display-name="getPlayerDisplayName"
      :new-drill-video="newDrillVideo" :is-uploading-video="isUploadingVideo" :selected-video-file="selectedVideoFile"
      @pick-file="handleVideoFilePick($event)" @submit="uploadDrillVideo"
      @close="showUploadVideoModal = false"></upload-video-modal>

    <!-- MODAL: Log Station Data -->
    <session-form-modal v-if="isCoach && (showLogModal && activePlayerForLog || showEditSessionModal && editingSession)"
      :t="t" :mode="showLogModal ? 'add' : 'edit'"
      :session="showLogModal ? newSession : editingSession"
      :active-player-for-log="activePlayerForLog || selectedPlayer || { preferred_name: '' }"
      :get-player-display-name="getPlayerDisplayName"
      :speed-unit="showLogModal ? logSpeedUnit : editSpeedUnit"
      @speed-unit="toggleSpeedUnit(showLogModal ? 'log' : 'edit', $event)"
      @close="showLogModal = false; showEditSessionModal = false"
      @submit="showLogModal ? saveSession() : updateSession()"></session-form-modal>
    <!-- ================================================================= -->
    <!-- STAGE 2: DUGOUT AR VIDEO ANALYZER MODAL                           -->
    <!-- ================================================================= -->
    <ar-analyzer-modal v-if="activeAnalyzerVideo" :t="t"
      :controller="analyzerController"></ar-analyzer-modal>

      </app-shell>
    </template>
  </div>

  <!-- Root Application Entry Module -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
